[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "verity-autonomous-os"
version = "0.1.0"
description = "A GitHub-native, human-governed autonomous mission pipeline with MCP tools and a zero-build command dashboard."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VerityAgent" }]
dependencies = ["fastmcp>=2.12,<3.0", "pydantic>=2.7,<3.0", "httpx>=0.27,<1.0", "PyYAML>=6.0,<7.0"]

[project.optional-dependencies]
agency = ["crewai>=0.100,<2.0"]

[dependency-groups]
dev = ["pytest>=8.2,<9.0", "pytest-cov>=5.0,<7.0"]

[project.scripts]
verity-architect = "mcp_and_crews.run_architect:main"
verity-builder = "mcp_and_crews.run_builder:main"
verity-mcp = "mcp_and_crews.mcp_stdio_server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_and_crews"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
