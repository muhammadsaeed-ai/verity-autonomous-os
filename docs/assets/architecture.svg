    <text x="588" y="309" fill="#f0f7ff" font-size="19" font-weight="750">Approval checkpoint</text>
    <text x="588" y="334" fill="#9bb2cb" font-size="12">Inspect goals + risks</text>
    <text x="588" y="352" fill="#9bb2cb" font-size="12">Maintainer approves plan</text>
    <rect x="588" y="367" width="80" height="17" rx="5" fill="#143626" stroke="#286448"/>
