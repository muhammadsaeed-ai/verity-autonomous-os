    <text x="328" y="283" fill="#67e8f9" font-size="9" font-weight="800" letter-spacing="1.6">02 / ARCHITECT</text>
    <text x="328" y="309" fill="#f0f7ff" font-size="19" font-weight="750">Typed blueprint</text>
    <text x="328" y="334" fill="#9bb2cb" font-size="12">Strict Pydantic schemas</text>
    <text x="328" y="352" fill="#9bb2cb" font-size="12">State + dependency DAG</text>
    <rect x="328" y="367" width="91" height="17" rx="5" fill="#102c42" stroke="#264b68"/>
    <text x="338" y="379" fill="#9bdcf1" font-size="8" font-weight="700">FASTAPI-LIKE IO</text>
  </g>
  <g>
    <rect x="570" y="205" width="220" height="190" rx="17" fill="#102135" stroke="#4384a2"/>
    <rect x="588" y="224" width="38" height="38" rx="10" fill="#10374b" stroke="#3b829c"/>
