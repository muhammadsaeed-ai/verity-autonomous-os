<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">VerityAgent Autonomous OS — mission control architecture</title>
<desc id="desc">A five-stage review-first AI engineering workflow: GitHub Issue, Architect, human approval, Builder, and CI plus pull-request review, surrounded by provider fallback, MCP tools, generated artifacts, and state controls.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070c16"/><stop offset=".5" stop-color="#0b1c30"/><stop offset="1" stop-color="#080e19"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#142b44"/><stop offset="1" stop-color="#0b1525"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2=".4"><stop stop-color="#eaf8ff"/><stop offset=".6" stop-color="#9cecff"/><stop offset="1" stop-color="#a7b7ff"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#0e7490" stop-opacity=".25"/><stop offset="1" stop-color="#0e7490" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="11"/></filter>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#000" flood-opacity=".25"/></filter>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#4f7997" stroke-opacity=".12" stroke-width="1"/></pattern>
</defs>
<rect width="1400" height="650" rx="28" fill="url(#bg)"/>
<rect width="1400" height="650" rx="28" fill="url(#grid)"/>
<ellipse cx="1085" cy="110" rx="310" ry="220" fill="url(#glow)"/>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="54" y="42" width="40" height="40" rx="12" fill="#122c44" stroke="#3b8bac"/>
  <path d="m74 49 11 6v13l-11 6-11-6V55Z" fill="none" stroke="#67e8f9" stroke-width="1.4"/>
  <path d="m68 62 4 4 8-9" fill="none" stroke="#e3fbff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="108" y="56" fill="#67e8f9" font-size="10" font-weight="800" letter-spacing="3.2">VERITYAGENT / AUTONOMOUS OS</text>
  <text x="54" y="128" fill="url(#hero)" font-size="41" font-weight="800" letter-spacing="-1.8">AI engineering with explicit control points.</text>
  <text x="56" y="158" fill="#9cb2cc" font-size="15">A mission lifecycle you can inspect — from issue intent to validated artifacts and a human-reviewed pull request.</text>
  <rect x="1072" y="52" width="270" height="40" rx="10" fill="#0c201f" stroke="#27664f"/>
  <circle cx="1094" cy="72" r="4" fill="#51e6a4"/>
  <text x="1108" y="76" fill="#a7f2ca" font-size="10" font-weight="800" letter-spacing="1.4">REVIEW-FIRST AUTONOMY</text>
</g>
<g stroke="url(#cyan)" stroke-width="2.4" fill="none" opacity=".92">
  <path d="M270 300H306"/><path d="m298 294 8 6-8 6"/>
  <path d="M530 300H566"/><path d="m558 294 8 6-8 6"/>
  <path d="M790 300H826"/><path d="m818 294 8 6-8 6"/>
  <path d="M1050 300H1086"/><path d="m1078 294 8 6-8 6"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
  <g>
    <rect x="50" y="205" width="220" height="190" rx="17" fill="url(#card)" stroke="#2c5879"/>
    <rect x="68" y="224" width="38" height="38" rx="10" fill="#102e45" stroke="#285a78"/>
    <path d="M77 235h20M77 243h20M77 251h13" stroke="#7edcf2" stroke-width="1.8" stroke-linecap="round"/>
