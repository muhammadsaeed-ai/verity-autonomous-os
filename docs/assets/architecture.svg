    <text x="848" y="283" fill="#67e8f9" font-size="9" font-weight="800" letter-spacing="1.6">04 / BUILDER</text>
    <text x="848" y="309" fill="#f0f7ff" font-size="19" font-weight="750">Code candidate</text>
    <text x="848" y="334" fill="#9bb2cb" font-size="12">Provider + offline fallback</text>
    <text x="848" y="352" fill="#9bb2cb" font-size="12">SVG + manifest + runbook</text>
    <rect x="848" y="367" width="97" height="17" rx="5" fill="#102c42" stroke="#264b68"/>
    <text x="858" y="379" fill="#9bdcf1" font-size="8" font-weight="700">ISOLATED OUTPUT</text>
  </g>
  <g>
    <rect x="1090" y="205" width="220" height="190" rx="17" fill="url(#card)" stroke="#3b6d8a"/>
    <rect x="1108" y="224" width="38" height="38" rx="10" fill="#102e45" stroke="#285a78"/>
    <path d="m1118 244 5 5 13-14" fill="none" stroke="#88f0bd" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1108" y="283" fill="#67e8f9" font-size="9" font-weight="800" letter-spacing="1.6">05 / VERIFICATION</text>
    <text x="1108" y="309" fill="#f0f7ff" font-size="19" font-weight="750">CI + pull request</text>
    <text x="1108" y="334" fill="#9bb2cb" font-size="12">Tests + static screening</text>
    <text x="1108" y="352" fill="#9bb2cb" font-size="12">Merge remains a human act</text>
    <rect x="1108" y="367" width="70" height="17" rx="5" fill="#143626" stroke="#286448"/>
    <text x="1118" y="379" fill="#98f0bf" font-size="8" font-weight="700">CI EVIDENCE</text>
  </g>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="50" y="431" width="1300" height="104" rx="17" fill="#0a1523" stroke="#21384f"/>
  <text x="72" y="459" fill="#75a8ca" font-size="9" font-weight="800" letter-spacing="2">CROSS-CUTTING CONTROL LAYER</text>
  <g font-size="11" font-weight="650">
    <rect x="72" y="478" width="160" height="31" rx="8" fill="#102237" stroke="#294960"/><text x="89" y="497" fill="#c8e6f6">FastMCP · stdio</text>
    <rect x="246" y="478" width="183" height="31" rx="8" fill="#102237" stroke="#294960"/><text x="263" y="497" fill="#c8e6f6">Gemini → OpenAI → fallback</text>
    <rect x="443" y="478" width="162" height="31" rx="8" fill="#102237" stroke="#294960"/><text x="460" y="497" fill="#c8e6f6">Issue-backed state</text>
    <rect x="619" y="478" width="174" height="31" rx="8" fill="#102237" stroke="#294960"/><text x="636" y="497" fill="#c8e6f6">Generated-code screening</text>
    <rect x="807" y="478" width="166" height="31" rx="8" fill="#102237" stroke="#294960"/><text x="824" y="497" fill="#c8e6f6">Offline verification</text>
    <rect x="987" y="478" width="166" height="31" rx="8" fill="#143626" stroke="#286448"/><text x="1004" y="497" fill="#a6f0c5">Human review required</text>
