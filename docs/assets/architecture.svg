    <text x="68" y="334" fill="#9bb2cb" font-size="12">Structured objective</text>
    <text x="68" y="352" fill="#9bb2cb" font-size="12">Constraints + acceptance</text>
    <rect x="68" y="367" width="94" height="17" rx="5" fill="#102c42" stroke="#264b68"/>
