  <text x="55" y="579" fill="#7895b4" font-size="11">DESIGN PRINCIPLE</text>
  <text x="55" y="603" fill="#e5f1ff" font-size="17" font-weight="720">A green CI run validates the package — it never guarantees the mission outcome.</text>
  <text x="1345" y="621" text-anchor="end" fill="#5f7997" font-size="9" letter-spacing="1.4">VERITYAGENT / MISSION CONTROL</text>
