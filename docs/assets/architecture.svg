<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="510" viewBox="0 0 1400 510" role="img" aria-labelledby="title desc">
<title id="title">VerityAgent Autonomous OS architecture</title><desc id="desc">GitHub Issues feed architect planning, approval gates the builder, tests validate artifacts, and a pull request protects human review.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101e"/><stop offset=".55" stop-color="#0b1c31"/><stop offset="1" stop-color="#07101d"/></linearGradient><linearGradient id="node" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132d49"/><stop offset="1" stop-color="#0b1627"/></linearGradient><linearGradient id="cyan"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#67e8f9"/></linearGradient></defs>
<rect width="1400" height="510" rx="28" fill="url(#bg)"/><g opacity=".13" stroke="#4d9ec8"><path d="M0 80H1400M0 160H1400M0 240H1400M0 320H1400M0 400H1400"/><path d="M100 0V510M200 0V510M300 0V510M400 0V510M500 0V510M600 0V510M700 0V510M800 0V510M900 0V510M1000 0V510M1100 0V510M1200 0V510M1300 0V510"/></g>
<text x="54" y="56" font-size="14" font-family="Arial,sans-serif" font-weight="700" letter-spacing="4" fill="#67e8f9">VERITYAGENT / AUTONOMOUS OS</text><text x="54" y="98" font-size="31" font-family="Arial,sans-serif" font-weight="700" fill="#e6f3ff">GitHub-native mission control</text><text x="54" y="127" font-size="14" font-family="Arial,sans-serif" fill="#92a6c4">Stateless phases. Verifiable artifacts. Human approval before promotion.</text>
<g stroke="url(#cyan)" stroke-width="2.5" fill="none"><path d="M250 247H296l-14-8m14 8-14 8"/><path d="M500 247H546l-14-8m14 8-14 8"/><path d="M750 247H796l-14-8m14 8-14 8"/><path d="M1000 247H1046l-14-8m14 8-14 8"/></g>
<g font-family="Arial,sans-serif">
<g><rect x="50" y="184" width="200" height="126" rx="18" fill="url(#node)" stroke="#28628a"/><text x="74" y="214" font-size="10" font-weight="700" letter-spacing="2" fill="#67e8f9">01 / INPUT</text><text x="74" y="246" font-size="19" font-weight="700" fill="#eef8ff">GitHub Issue</text><text x="74" y="269" font-size="12" fill="#9db7d3">Structured mission brief</text><text x="74" y="288" font-size="12" fill="#9db7d3">Label: new-project</text></g>
<g><rect x="300" y="184" width="200" height="126" rx="18" fill="url(#node)" stroke="#28628a"/><text x="324" y="214" font-size="10" font-weight="700" letter-spacing="2" fill="#67e8f9">02 / ARCHITECT</text><text x="324" y="246" font-size="19" font-weight="700" fill="#eef8ff">Blueprint</text><text x="324" y="269" font-size="12" fill="#9db7d3">Pydantic schema</text><text x="324" y="288" font-size="12" fill="#9db7d3">State + dependency DAG</text></g>
<g><rect x="550" y="184" width="200" height="126" rx="18" fill="url(#node)" stroke="#287ea0"/><text x="574" y="214" font-size="10" font-weight="700" letter-spacing="2" fill="#67e8f9">03 / HUMAN GATE</text><text x="574" y="246" font-size="19" font-weight="700" fill="#eef8ff">Approval</text><text x="574" y="269" font-size="12" fill="#9db7d3">Review the plan</text><text x="574" y="288" font-size="12" fill="#9db7d3">Label: approved</text></g>
<g><rect x="800" y="184" width="200" height="126" rx="18" fill="url(#node)" stroke="#28628a"/><text x="824" y="214" font-size="10" font-weight="700" letter-spacing="2" fill="#67e8f9">04 / BUILDER</text><text x="824" y="246" font-size="19" font-weight="700" fill="#eef8ff">Artifacts</text><text x="824" y="269" font-size="12" fill="#9db7d3">Runnable plan package</text><text x="824" y="288" font-size="12" fill="#9db7d3">SVG + manifest + tests</text></g>
<g><rect x="1050" y="184" width="200" height="126" rx="18" fill="url(#node)" stroke="#28628a"/><text x="1074" y="214" font-size="10" font-weight="700" letter-spacing="2" fill="#67e8f9">05 / VERIFICATION</text><text x="1074" y="246" font-size="19" font-weight="700" fill="#eef8ff">Pull request</text><text x="1074" y="269" font-size="12" fill="#9db7d3">CI + code review</text><text x="1074" y="288" font-size="12" fill="#9db7d3">No automatic merge</text></g></g>
<rect x="50" y="356" width="1200" height="85" rx="16" fill="#0b1828" stroke="#213d59"/><text x="76" y="384" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#67e8f9">CROSS-CUTTING CONTROLS</text><g font-family="Arial,sans-serif" font-size="13" fill="#c1d5eb"><text x="76" y="414">FastMCP stdio</text><text x="280" y="414">Deterministic fallback</text><text x="520" y="414">Issue-backed state</text><text x="730" y="414">Isolated artifact paths</text><text x="975" y="414">Python + YAML CI</text></g>
<text x="54" y="480" font-family="Arial,sans-serif" font-size="11" fill="#7d95b5">A build phase validates the generated package; it does not claim the business outcome is complete.</text></svg>